openapi: 3.0.3
info:
  title: Hawat Mobile API
  version: 1.8.0
  description: |
    Hawat mobile app API (com.os.hawat). All responses are JSON.

    - Authentication: `Authorization: Bearer <token>` (Laravel Sanctum). A token is issued per device on login.
    - Phone numbers use the `05XXXXXXXX` format; `+9665…`, `9665…` and Arabic digits are also accepted and normalized.
    - Validation errors: `422` shaped as `{ "message": "...", "errors": { "field": ["..."] } }`.
    - Unauthenticated: `401 { "message": "Unauthenticated." }`. Disabled account: `403`.
    - Throttling: login 6/min, OTP request 3/min per phone number.
    - Lookup lists: `GET /lookups` once after login.
    - The owner portal lives under `/owner/*` and requires the `owner` role; every record is scoped to its owner (`404` otherwise).
    - Captains have no account: a captain is a fisher record the owner manages (`/owner/captains`, `is_captain: true`), assigned to a boat and to trips. The owner runs every trip step (`/owner/trips/*`: create, start, cancel, submit the catch). There is no `captain` role, portal or login.
    - The counter portal lives under `/counter/*` and requires the `counter` role; only trips that returned to the counter's port are visible (`404` otherwise).
    - The dalal portal lives under `/dalal/*` and requires the `dalal` role; sales, customers, partnership requests and workers of another dalal are `404`.
    - Counter hiring: `GET /hiring-rounds` and `/counter-applications/*` need no token. An applicant applies in an open round, verifies the phone with the SMS code, then follows the application with its `token`. Approval (by the operating company, on the web) creates a `counter` account with the password chosen at signup.
    - Printed invoices: every `Sale` carries `invoice_url`, a signed A4 page the app opens in the browser to print or save as PDF (no token needed).
    - Notifications (`/notifications`) are per account for every role; the app registers its device with `POST /auth/fcm-token` to receive pushes.
    - Paginated lists return `{ data: [...], links: {...}, meta: {...} }` with `?page=` and `?per_page=` (max 100).
    - Retries: every authenticated `POST` accepts an `Idempotency-Key` header. Repeating a request with the same key after a lost response returns the first response (`Idempotency-Replayed: true`) without creating a second record.
    - Concurrent edits: `Boat` and `Fisher` (captains and crew) carry `version` (also sent as the `ETag` header). Send it back in `If-Match` (or a `version` body field) on `PUT`; a stale version gets `409` and nothing is written.
    - Uniqueness: `boat_number`, fisher `national_id` and account `phone` are unique system-wide, including inactive records; a duplicate is `422` on the same field. Deleted captains and crew free their `national_id`. A captain's or crew member's `phone` is not an account and is not unique.
    - App config: `GET /app/config` (no token) gives the minimum app version for a forced update, the store link, whether SMS password reset is available, and the support numbers. Read it on every launch.
    - Changelog: docs/api/CHANGELOG.md.
servers:
- url: /api/v1
tags:
- name: app
  description: إعداد التطبيق قبل الدخول
- name: auth
  description: الدخول والحساب واستعادة كلمة المرور
- name: lookups
  description: القوائم المرجعية
- name: owner
  description: بوابة المالك — الرئيسة والمخزون
- name: owner-fleet
  description: المالك — القوارب والصيانة والكباتن والطاقم
- name: owner-contacts
  description: المالك — العملاء والموردون والموظفون
- name: owner-trips
  description: المالك — الرحلات بدورتها كلها وسجل الصيد
- name: owner-sales
  description: المالك — البيع والإرسال للدلال
- name: notifications
  description: إشعارات الحساب — لكل الأدوار
- name: counter
  description: بوابة العدّاد — طابور الميناء والعد والتقرير المفصّل
- name: dalal
  description: بوابة الدلال — الرئيسة والمخزون والتقارير والإعدادات
- name: dalal-sales
  description: الدلال — البيع من المخزون والعملاء
- name: dalal-owners
  description: الدلال — طلبات الملاك والصيّادون المرتبطون ودفعاتهم
- name: counter-applications
  description: التقديم لوظيفة عدّاد لدى شركات التشغيل — بلا حساب
paths:
  /app/config:
    get:
      tags:
      - app
      summary: إعداد التطبيق — التحديث الإجباري وأرقام الدعم والرسائل النصية
      description: بلا رمز. يقرؤه التطبيق عند كل فتح، فيطلب التحديث إن كانت نسخته دون `min_version`، ويختار في "نسيت كلمة المرور" بين رمز الرسائل (`sms_enabled`) والتواصل مع الدعم.
      security: []
      responses:
        '200':
          description: الإعداد
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AppConfig'
  /auth/login:
    post:
      tags:
      - auth
      summary: تسجيل الدخول بالجوال
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - phone
              - password
              properties:
                phone:
                  type: string
                  example: '0500000001'
                password:
                  type: string
                  format: password
                device_name:
                  type: string
                  example: Samsung A54
                  description: يُحفظ مع الرمز لتمييز الأجهزة
                fcm_token:
                  type: string
                  description: رمز Firebase للإشعارات — يُحفظ مع الدخول
      responses:
        '200':
          description: دخول ناجح
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: 12|Yk3…
                      token_type:
                        type: string
                        example: Bearer
                      user:
                        $ref: '#/components/schemas/User'
                  message:
                    type: string
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/logout:
    post:
      tags:
      - auth
      summary: تسجيل الخروج من الجهاز الحالي
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/me:
    get:
      tags:
      - auth
      summary: الحساب الحالي
      responses:
        '200':
          description: الحساب
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    put:
      tags:
      - auth
      summary: تعديل بيانات الحساب
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                  nullable: true
                locale:
                  type: string
                  enum:
                  - ar
                  - en
      responses:
        '200':
          description: الحساب بعد التعديل
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/change-password:
    post:
      tags:
      - auth
      summary: تغيير كلمة المرور (يُخرج بقية الأجهزة)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - current_password
              - password
              - password_confirmation
              properties:
                current_password:
                  type: string
                  format: password
                password:
                  type: string
                  format: password
                  minLength: 8
                password_confirmation:
                  type: string
                  format: password
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/avatar:
    post:
      tags:
      - auth
      summary: رفع الصورة الشخصية (multipart)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - avatar
              properties:
                avatar:
                  type: string
                  format: binary
                  description: JPG/PNG/WebP حتى 2MB
      responses:
        '200':
          description: الحساب بعد التعديل
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags:
      - auth
      summary: إزالة الصورة الشخصية
      responses:
        '200':
          description: الحساب بعد التعديل
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/fcm-token:
    post:
      tags:
      - auth
      summary: تحديث رمز إشعارات Firebase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - fcm_token
              properties:
                fcm_token:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Message'
  /auth/forgot-password:
    post:
      tags:
      - auth
      summary: طلب رمز التحقق لاستعادة كلمة المرور
      description: الردّ واحد وُجد الجوال أم لا. الرمز 6 أرقام صالح 10 دقائق و5 محاولات.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - phone
              properties:
                phone:
                  type: string
                  example: '0500000001'
      responses:
        '200':
          description: أُرسل الرمز إن كان الجوال مسجّلًا
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      expires_in:
                        type: integer
                        example: 600
                        description: بالثواني
        '429':
          description: تجاوز الحدّ — انتظر دقيقة
  /auth/verify-otp:
    post:
      tags:
      - auth
      summary: التحقق من الرمز قبل شاشة كلمة المرور الجديدة
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - phone
              - code
              properties:
                phone:
                  type: string
                code:
                  type: string
                  example: '123456'
      responses:
        '200':
          description: الرمز صحيح
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      verified:
                        type: boolean
                        example: true
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/reset-password:
    post:
      tags:
      - auth
      summary: كلمة المرور الجديدة بالرمز (يُخرج كل الأجهزة)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - phone
              - code
              - password
              - password_confirmation
              properties:
                phone:
                  type: string
                code:
                  type: string
                password:
                  type: string
                  format: password
                  minLength: 8
                password_confirmation:
                  type: string
                  format: password
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '422':
          $ref: '#/components/responses/ValidationError'
  /lookups:
    get:
      tags:
      - lookups
      summary: كل القوائم المرجعية في ردّ واحد
      responses:
        '200':
          description: القوائم
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Lookups'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /notifications:
    get:
      tags:
      - notifications
      summary: إشعارات الحساب (الأحدث أولًا) — meta.unread_count يحمل عدد غير المقروء
      parameters:
      - name: page
        in: query
        schema:
          type: integer
      - name: per_page
        in: query
        schema:
          type: integer
          default: 25
      - name: unread
        in: query
        description: 1 = غير المقروء فقط
        schema:
          type: boolean
      responses:
        '200':
          description: الإشعارات
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Notification'
                - $ref: '#/components/schemas/Pagination'
                - type: object
                  properties:
                    meta:
                      type: object
                      properties:
                        unread_count:
                          type: integer
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /notifications/unread-count:
    get:
      tags:
      - notifications
      summary: عدد غير المقروء — لشارة الجرس
      responses:
        '200':
          description: العدد
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      unread_count:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /notifications/read-all:
    post:
      tags:
      - notifications
      summary: تعليم كل الإشعارات مقروءة
      responses:
        '200':
          description: عدد ما عُلّم
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      marked:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /notifications/{notification}/read:
    parameters:
    - name: notification
      in: path
      required: true
      description: معرّف الإشعار
      schema:
        type: integer
    post:
      tags:
      - notifications
      summary: تعليم إشعار مقروءًا
      responses:
        '200':
          description: الإشعار بعد التعليم
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /counter/dashboard:
    get:
      tags:
      - counter
      summary: رئيسة العدّاد — ميناء عمله وأعداده وطابوره وما جرى عدّه
      responses:
        '200':
          description: الرئيسة
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CounterDashboard'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /counter/trips:
    get:
      tags:
      - counter
      summary: رحلات ميناء العدّاد — view=awaiting (بحاجة لموافقتك) / counting (جارية العد) / counted (معدودة)
      parameters:
      - name: page
        in: query
        schema:
          type: integer
      - name: per_page
        in: query
        schema:
          type: integer
          default: 25
      - name: view
        in: query
        schema:
          type: string
          enum:
          - awaiting
          - counting
          - counted
      - name: status
        in: query
        description: حالة الوزارة
        schema:
          type: string
      - name: search
        in: query
        description: رقم الرحلة
        schema:
          type: string
      responses:
        '200':
          description: الرحلات
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Trip'
                - $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /counter/trips/{trip}:
    parameters:
    - name: trip
      in: path
      required: true
      description: معرّف رحلة عادت إلى ميناء العدّاد
      schema:
        type: integer
    get:
      tags:
      - counter
      summary: تفاصيل رحلة مع سطور المصيد المعلنة والمعدودة
      responses:
        '200':
          description: رحلة
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /counter/trips/{trip}/report:
    parameters:
    - name: trip
      in: path
      required: true
      description: معرّف الرحلة
      schema:
        type: integer
    get:
      tags:
      - counter
      summary: تقرير مفصّل للرحلة — أقسام معنونة بسطور (تسمية، قيمة) وتفاصيل المصيد
      responses:
        '200':
          description: التقرير
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TripReport'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /counter/trips/{trip}/receive:
    parameters:
    - name: trip
      in: path
      required: true
      description: معرّف الرحلة
      schema:
        type: integer
    post:
      tags:
      - counter
      summary: استلام الرحلة وبدء عملية العد → تحت الإحصاء
      responses:
        '200':
          description: الرحلة بعد الفعل
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /counter/trips/{trip}/count:
    parameters:
    - name: trip
      in: path
      required: true
      description: معرّف الرحلة
      schema:
        type: integer
    post:
      tags:
      - counter
      summary: تأكيد الكميات وإنهاء العد → بانتظار الاعتماد، ويُفتح المصيد للبيع
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountInput'
      responses:
        '200':
          description: الرحلة بعد العد مع سطور المصيد
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /owner/dashboard:
    get:
      tags:
      - owner
      summary: رئيسة المالك — ما ينتظر المالك والمؤشرات والمخزون والرحلات النشطة وآخر المبيعات
      parameters:
      - name: period
        in: query
        description: فترة الإيرادات وعدد الفواتير والمصيد المعدود. الأسبوع يبدأ الأحد. بلا فترة (أو `all`) كل ما مضى. القوارب والرحلات في طورها وغير المحصّل قائمة الآن فلا فترة لها.
        schema:
          type: string
          enum:
          - today
          - week
          - month
          - year
          - all
      responses:
        '200':
          description: الرئيسة
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Dashboard'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /owner/stock:
    get:
      tags:
      - owner
      summary: الأسماك المتوفرة عند المالك مجموعةً بالصنف
      responses:
        '200':
          description: المخزون
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StockLine'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /owner/stock/movements:
    get:
      tags:
      - owner
      summary: حركات الصنف (دفتر المخزون)
      parameters:
      - name: page
        in: query
        description: رقم الصفحة
        schema:
          type: integer
      - name: per_page
        in: query
        description: حجم الصفحة (حتى 100)
        schema:
          type: integer
          default: 25
      - name: species_id
        in: query
        description: صنف بعينه
        schema:
          type: integer
      - name: trip_id
        in: query
        description: رحلة بعينها
        schema:
          type: integer
      responses:
        '200':
          description: الحركات
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/StockMovement'
                - $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /owner/dalals:
    get:
      tags:
      - owner
      summary: الدلالون المفعّلون — لقائمة الإرسال
      parameters:
      - name: search
        in: query
        description: بالاسم
        schema:
          type: string
      responses:
        '200':
          description: الدلالون
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        phone:
                          type: string
