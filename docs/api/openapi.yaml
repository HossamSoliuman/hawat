          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - dalal-sales
      summary: إضافة عملية بيع من المخزون
      description: |
        سطر لكل صنف بوزنه وسعره. `trip_id` اختياري: بدونه يُصرف الوزن من دفعات الصنف الأقدم استلامًا أوّلًا وقد ينقسم على أكثر من رحلة ومالك (كل جزء سطر فاتورة بمالكه). لا يتجاوز مجموع السطور المتاح (`422` على `items.N.weight_kg`).
        العمولة والأجور تُحسب لكل سطر من اتفاق مالكه المقبول (`/dalal/partnerships`) على صافي السطر بعد توزيع الخصم؛ بلا اتفاق = صفر. الفاتورة "مكتمل" حين تُدفع كاملة وإلا "قيد التنفيذ".
