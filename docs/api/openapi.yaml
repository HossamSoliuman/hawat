              $ref: '#/components/schemas/CounterApplicationInput'
      responses:
        '201':
          description: حُفظ الطلب وأُرسل الرمز
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/CounterApplication'
                  meta:
                    type: object
                    properties:
                      expires_in:
                        type: integer
                        example: 600
                        description: صلاحية الرمز بالثواني
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: تجاوز الحدّ — انتظر دقيقة
  /counter-applications/{token}:
    parameters:
    - $ref: '#/components/parameters/ApplicationToken'
    get:
      tags:
      - counter-applications
      summary: حالة الطلب
      security: []
      responses:
        '200':
          description: الطلب
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CounterApplication'
        '404':
          $ref: '#/components/responses/NotFound'
  /counter-applications/{token}/verify:
    parameters:
    - $ref: '#/components/parameters/ApplicationToken'
    post:
      tags:
      - counter-applications
      summary: توثيق الجوال بالرمز — يوصل الطلب إلى الشركة
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
                  example: '123456'
      responses:
        '200':
          description: وُثّق الجوال
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/CounterApplication'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /counter-applications/{token}/resend:
    parameters:
    - $ref: '#/components/parameters/ApplicationToken'
    post:
      tags:
      - counter-applications
      summary: إعادة إرسال رمز التوثيق
      security: []
      responses:
        '200':
          description: أُرسل رمز جديد
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      expires_in:
                        type: integer
                        example: 600
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /counter-applications/{token}/withdraw:
    parameters:
    - $ref: '#/components/parameters/ApplicationToken'
    post:
      tags:
      - counter-applications
      summary: سحب طلب قيد المراجعة
      security: []
      responses:
        '200':
          description: سُحب الطلب
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/CounterApplication'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ApplicationToken:
      name: token
      in: path
      required: true
      description: مفتاح الطلب من ردّ التقديم (`data.token`)
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        مفتاح فريد لكل عملية (UUID مثلًا، حتى 255 حرفًا بلا مسافات). أعد الطلب بالمفتاح نفسه إن ضاع ردّه: يعود الردّ الأول نفسه بترويسة `Idempotency-Replayed: true` ولا يُنشأ سجلّ ثانٍ. المفتاح لكل حساب ويُحفظ ردّه 24 ساعة.
        المفتاح نفسه لطلب مختلف → `422`؛ والطلب الأول ما زال يُنفَّذ → `409`. الردّ غير الناجح (`422`) لا يُحفظ، فصحّح وأعد بالمفتاح نفسه. يُقبل على كل طلب POST يحمل رمزًا.
      schema:
        type: string
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        نسخة السجل التي عدّلت عليها (`version` من الردّ، أو ترويسة `ETag`): `"3"` أو `3`. إن تغيّر السجل منذ قرأته يُرفض التعديل بـ`409` ولا تُكتب قيمه. يمكن إرسالها بدلًا من ذلك حقل `version` في الجسم. بلا نسخة يُقبل التعديل كما كان.
      schema:
        type: string
  headers:
    ETag:
      description: نسخة السجل بين علامتي تنصيص (`"3"`) — هي ما يُرسل في If-Match.
      schema:
        type: string
    IdempotencyReplayed:
      description: '`true` حين يكون هذا الردّ المحفوظ لطلب سابق بالمفتاح نفسه.'
      schema:
        type: string
  schemas:
    AvatarUpload:
      type: object
      required:
      - avatar
      properties:
        avatar:
          type: string
          format: binary
          description: صورة JPG/PNG/WebP حتى 2MB و4096 بكسل للضلع — صورة شخصية فقط.
    Setup:
      type: object
      description: |
        اكتمال إعداد القارب للرحلات. `missing` يمنع الاكتمال (`status` قارب معطّل أو في الصيانة، `captain` بلا كابتن، `captain_inactive` الكابتن غير نشط، `crew` لا فرد طاقم نشط). `warnings` لا تمنعه (`license_expired` رخصة القارب منتهية، `crew_over_capacity` الطاقم أكثر من سعة القارب).
        استرشادي: إنشاء الرحلة لا يُرفض اليوم بسببه.
      properties:
        ready:
          type: boolean
        missing:
          type: array
          items:
            $ref: '#/components/schemas/SetupItem'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/SetupItem'
    SetupItem:
      type: object
      properties:
        key:
          type: string
          enum:
          - status
          - captain
