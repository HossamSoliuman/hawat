name: Deploy to production

on:
  push:
    branches:
      - main

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: 191.218.163.161
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 4m
          script: |
            set -e
            cd /www/wwwroot/hawat
            git -c safe.directory=/www/wwwroot/hawat pull --ff-only origin main
            php artisan migrate --force
            php artisan optimize
            # بيئة الاختبار (hawat.sa/staging) تتبع main أيضًا، بمكتبات الإنتاج نفسها.
            if [ -d /www/wwwroot/hawat-staging ]; then
              cd /www/wwwroot/hawat-staging
              git -c safe.directory=/www/wwwroot/hawat-staging pull --ff-only origin main
              rsync -a --delete /www/wwwroot/hawat/vendor/ vendor/
              php artisan migrate --force
              php artisan optimize
            fi
